<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    :root { color-scheme: light; }
    html, body { margin: 0; padding: 0; font-family: "Source Sans Pro", sans-serif; color: #31333F; overflow: hidden; }
    .stage {
      width: 100%;
      background: #111;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      gap: 4px;
    }
    .stage.single #paneR { display: none; }
    .pane { flex: 1; min-width: 0; background: #111; }
    .label {
      font-size: 12px;
      color: #ddd;
      padding: 6px 8px 2px;
      line-height: 1.2;
    }
    video {
      width: 100%;
      height: auto;
      min-height: 280px;
      max-height: none;
      display: block;
      background: #000;
      object-fit: contain;
    }
    .bar { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; line-height: 1.4; }
    button {
      flex: 1; min-width: 72px; padding: 8px 10px; cursor: pointer;
      border-radius: 8px; border: 1px solid #d3d3d3; background: #fff; font-size: 14px;
    }
    button:hover { border-color: #ff4b4b; color: #ff4b4b; }
    button.primary { background: #ff4b4b; color: #fff; border-color: #ff4b4b; }
    button.primary:hover { background: #d03636; color: #fff; }
    .time { font-variant-numeric: tabular-nums; font-size: 14px; min-width: 168px; }
    .scrub-row { margin-top: 6px; display: flex; align-items: center; }
    #scrub { width: 100%; cursor: pointer; }
    .hint { margin-top: 6px; font-size: 12px; color: #808495; line-height: 1.45; white-space: normal; }
  </style>
</head>
<body>
  <div class="stage dual" id="stage">
    <div class="pane" id="paneL">
      <div class="label">left</div>
      <video id="vL" preload="auto" playsinline muted></video>
    </div>
    <div class="pane" id="paneR">
      <div class="label">right</div>
      <video id="vR" preload="auto" playsinline muted></video>
    </div>
  </div>
  <div class="bar">
    <button id="play" class="primary" type="button">播放</button>
    <button id="back15" type="button">−15s</button>
    <button id="back" type="button">−1s</button>
    <button id="t0" type="button">设为起点 t0</button>
    <button id="t1" type="button">设为终点 t1</button>
    <button id="fwd" type="button">+1s</button>
    <button id="fwd15" type="button">+15s</button>
    <div class="time" id="cur">播放进度 00:00.000</div>
  </div>
  <div class="scrub-row">
    <input id="scrub" type="range" min="0" max="1000" value="0" step="1" />
  </div>
  <div class="hint">左右以 left 时间为准同步播停与跳转，便于对比。用下方进度条或 ±1s / ±15s 定位后点「设为起点 / 终点」。标「好」前确认：双手可见（单次消失≤10秒）且动作完整（起始→执行→结束）。</div>
  <script>
    const PLAYER_VER = 8;
    const left = document.getElementById("vL");
    const right = document.getElementById("vR");
    const stage = document.getElementById("stage");
    const playBtn = document.getElementById("play");
    const cur = document.getElementById("cur");
    const scrub = document.getElementById("scrub");
    const SEEK_KEY = "cutter_player_seek_n";
    let lastSeekN = null;
    try { lastSeekN = sessionStorage.getItem(SEEK_KEY); } catch (e) {}
    let pinEndUntil = 0;
    let lastHeight = 0;
    let syncLock = 0;
    let hasRight = false;
    let pendingTime = null;
    let skipTimer = null;
    let seeking = false;
    let seekGen = 0;
    let resumeAfterSeek = false;
    let dragging = false;

    function follower() { return hasRight ? right : null; }
    function mediaDuration() {
      const d = left.duration;
      return Number.isFinite(d) && d > 0 ? d : 1e9;
    }
    function shownTime() {
      if (pendingTime != null) return pendingTime;
      return left.currentTime || 0;
    }
    function busySeek() {
      return seeking || skipTimer != null || dragging || inSync();
    }
    function fmt(t) {
      if (!Number.isFinite(t) || t < 0) t = 0;
      const m = Math.floor(t / 60);
      const s = t - m * 60;
      return String(m).padStart(2, "0") + ":" + s.toFixed(3).padStart(6, "0");
    }
    function tick() {
      const t = shownTime();
      cur.textContent = "播放进度 " + fmt(t);
      const playing = (seeking || skipTimer || dragging) ? resumeAfterSeek : !left.paused;
      playBtn.textContent = playing ? "暂停" : "播放";
      const dur = mediaDuration();
      if (Number.isFinite(dur) && dur > 0 && dur < 1e8 && !dragging) {
        scrub.value = String(Math.round((t / dur) * 1000));
      }
    }
    function send(type, data) {
      window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data), "*");
    }
    function beginSync() { syncLock += 1; }
    function endSync() { window.setTimeout(function () { syncLock = Math.max(0, syncLock - 1); }, 40); }
    function inSync() { return syncLock > 0; }
    function playSafe(v) {
      if (!v || !v.dataset.src) return;
      const p = v.play();
      if (p && p.catch) {
        p.catch(function () {
          if (v.readyState < 2) {
            v.addEventListener("canplay", function () { playSafe(v); }, { once: true });
          }
        });
      }
    }
    function playBoth() {
      beginSync();
      pinEndUntil = 0;
      resumeAfterSeek = false;
      left.playbackRate = 1;
      const f = follower();
      if (f) {
        f.playbackRate = 1;
        if (Math.abs((f.currentTime || 0) - (left.currentTime || 0)) > 0.05) {
          setTime(f, left.currentTime || 0);
        }
      }
      playSafe(left);
      playSafe(f);
      endSync();
      tick();
    }
    function pauseBoth() {
      beginSync();
      left.pause();
      const f = follower();
      if (f) {
        f.pause();
        f.playbackRate = 1;
        setTime(f, left.currentTime || 0);
      }
      endSync();
      tick();
    }
    function setTime(v, t) {
      if (!v) return;
      const dur = Number.isFinite(v.duration) ? v.duration : t;
      v.currentTime = Math.min(Math.max(0, t), Math.max(0, dur));
    }
    function setHeight() {
      const width = Math.max(document.body.clientWidth || 0, 480);
      const n = hasRight ? 2 : 1;
      let videoH = Math.round((width / n) * 9 / 16);
      if (left.videoWidth > 0 && left.videoHeight > 0) {
        videoH = Math.round((width / n) * left.videoHeight / left.videoWidth);
      }
      let cap = 720;
      try { cap = Math.floor((window.parent.innerHeight || 900) * 0.58); } catch (e) {}
      videoH = Math.min(Math.max(videoH, 280), cap);
      left.style.minHeight = videoH + "px";
      left.style.height = videoH + "px";
      if (hasRight) {
        right.style.minHeight = videoH + "px";
        right.style.height = videoH + "px";
      }
      const bar = document.querySelector(".bar");
      const hint = document.querySelector(".hint");
      const scrubRow = document.querySelector(".scrub-row");
      const extra = (bar ? bar.offsetHeight : 48) +
        (scrubRow ? scrubRow.offsetHeight : 24) +
        (hint ? hint.offsetHeight : 24) + 28;
      const total = videoH + extra;
      if (total === lastHeight) return;
      lastHeight = total;
      send("streamlit:setFrameHeight", { height: total });
    }
    function mediaUrl(file, port, sid) {
      const rawHost = window.location.hostname || "127.0.0.1";
      const host = rawHost === "localhost" ? "127.0.0.1" : rawHost;
      return "http://" + host + ":" + port + "/" + String(file).replace(/^\//, "") +
        "?sid=" + encodeURIComponent(sid || "") + "&pv=" + PLAYER_VER;
    }
    function applyOne(video, file, port, sid) {
      if (!file || !port) {
        video.removeAttribute("src");
        video.load();
        video.dataset.src = "";
        return;
      }
      const url = mediaUrl(file, port, sid);
      if (video.dataset.src === url) return;
      video.dataset.src = url;
      video.dataset.retried = "";
      video.src = url;
    }
    function applySource(leftFile, rightFile, port, sid) {
      const lf = leftFile || "";
      const rf = rightFile || "";
      hasRight = Boolean(rf);
      stage.classList.toggle("single", !hasRight);
      applyOne(left, lf, port, sid);
      applyOne(right, rf, port, sid);
    }
    function applySeek(t, n) {
      if (n == null || n === "") return;
      if (String(n) === String(lastSeekN)) return;
      lastSeekN = n;
      try { sessionStorage.setItem(SEEK_KEY, String(n)); } catch (e) {}
      pinEndUntil = 0;
      const target = Number(t);
      if (!Number.isFinite(target) || target < 0) return;
      const go = () => commitSeek(target, false);
      if (left.readyState >= 1) go();
      else left.addEventListener("loadedmetadata", go, { once: true });
    }
    function mark(kind) {
      window.parent.postMessage({
        type: "cutter-mark",
        kind: kind,
        t: shownTime(),
        n: Date.now(),
      }, "*");
    }
    function waitSeeked(v, target, gen) {
      return new Promise(function (resolve) {
        if (!v || !v.dataset.src) {
          resolve();
          return;
        }
        let settled = false;
        const finish = function () {
          if (settled) return;
          settled = true;
          v.removeEventListener("seeked", onSeeked);
          v.removeEventListener("error", finish);
          resolve();
        };
        const onSeeked = function () {
          if (gen !== seekGen) {
            finish();
            return;
          }
          if (Math.abs((v.currentTime || 0) - target) < 0.6) finish();
        };
        v.addEventListener("seeked", onSeeked);
        v.addEventListener("error", finish);
        if (v.readyState >= 2 && Math.abs((v.currentTime || 0) - target) < 0.08) {
          finish();
        }
        window.setTimeout(finish, 5000);
      });
    }
    function commitSeek(t, resume) {
      const target = Math.min(mediaDuration(), Math.max(0, t));
      const gen = ++seekGen;
      pendingTime = target;
      seeking = true;
      if (resume == null) resume = resumeAfterSeek;
      resumeAfterSeek = !!resume;
      tick();
      beginSync();
      left.pause();
      if (follower()) follower().pause();
      setTime(left, target);
      setTime(follower(), target);
      endSync();
      const waiters = [waitSeeked(left, target, gen)];
      if (follower()) waiters.push(waitSeeked(follower(), target, gen));
      Promise.all(waiters).then(function () {
        if (gen !== seekGen) return;
        pendingTime = null;
        seeking = false;
        if (resumeAfterSeek) playBoth();
        else tick();
      });
    }
    function skipBy(dt) {
      if (!seeking && skipTimer == null && !dragging) {
        resumeAfterSeek = !left.paused;
      }
      pendingTime = Math.min(mediaDuration(), Math.max(0, shownTime() + dt));
      tick();
      if (skipTimer) window.clearTimeout(skipTimer);
      skipTimer = window.setTimeout(function () {
        skipTimer = null;
        commitSeek(pendingTime, resumeAfterSeek);
      }, 280);
    }
    function bindSync(from, to) {
      from.addEventListener("play", () => {
        if (inSync() || busySeek()) return;
        beginSync();
        pinEndUntil = 0;
        playSafe(to);
        endSync();
        tick();
      });
      from.addEventListener("pause", () => {
        if (inSync() || busySeek()) return;
        beginSync();
        if (to) to.pause();
        endSync();
        tick();
      });
    }

    left.loop = false;
    right.loop = false;
    left.muted = true;
    right.muted = true;
    left.addEventListener("timeupdate", () => {
      if (skipTimer || seeking || dragging) return;
      tick();
    });
    left.addEventListener("ended", () => {
      pinEndUntil = Date.now() + 500;
      if (!Number.isFinite(left.duration) || left.duration <= 0) return;
      resumeAfterSeek = false;
      beginSync();
      left.pause();
      if (follower()) follower().pause();
      const t = Math.max(0, left.duration - 0.04);
      setTime(left, t);
      setTime(follower(), t);
      endSync();
      tick();
    });
    left.addEventListener("seeked", () => {
      if (Date.now() < pinEndUntil && left.currentTime < 0.2 && Number.isFinite(left.duration)) {
        beginSync();
        const t = Math.max(0, left.duration - 0.04);
        setTime(left, t);
        setTime(follower(), t);
        endSync();
        tick();
      }
    });
    left.addEventListener("play", () => { pinEndUntil = 0; });
    function onError(video) {
      return () => {
        const err = video.error;
        const code = err ? err.code : 0;
        if (code === 2 && video.dataset.src && video.dataset.retried !== "1") {
          video.dataset.retried = "1";
          const t = video.currentTime || 0;
          const src = video.dataset.src;
          window.setTimeout(() => {
            video.src = src;
            applySeek(t, Date.now());
          }, 200);
          return;
        }
        if (video === left) {
          cur.textContent = "视频加载失败（code " + code + "）。请重启 Streamlit 后刷新页面。";
        }
      };
    }
    left.addEventListener("error", onError(left));
    right.addEventListener("error", onError(right));
    left.addEventListener("loadedmetadata", () => { tick(); setHeight(); });
    left.addEventListener("loadeddata", setHeight);
    right.addEventListener("loadedmetadata", setHeight);
    window.addEventListener("resize", setHeight);
    bindSync(left, right);
    bindSync(right, left);
    function alignFollower(hard) {
      const f = follower();
      if (!f || !hasRight) return;
      const lt = left.currentTime || 0;
      const rt = f.currentTime || 0;
      const drift = rt - lt;
      if (hard || Math.abs(drift) > 0.2) {
        beginSync();
        setTime(f, lt);
        f.playbackRate = 1;
        endSync();
        return;
      }
      if (Math.abs(drift) < 0.035) {
        if (Math.abs(f.playbackRate - 1) > 0.001) f.playbackRate = 1;
        return;
      }
      f.playbackRate = Math.max(0.9, Math.min(1.1, 1 - drift * 2.8));
    }
    function keepInSync() {
      if (!hasRight || busySeek()) return;
      const f = follower();
      if (!f) return;
      if (!left.paused && f.paused) {
        if (Math.abs((f.currentTime || 0) - (left.currentTime || 0)) > 0.08) {
          setTime(f, left.currentTime || 0);
        }
        f.playbackRate = 1;
        playSafe(f);
        return;
      }
      if (left.paused && !f.paused) {
        f.pause();
        f.playbackRate = 1;
        setTime(f, left.currentTime || 0);
        return;
      }
      if (left.paused || f.paused) return;
      alignFollower(false);
    }
    window.setInterval(keepInSync, 80);

    playBtn.onclick = () => {
      if (seeking || skipTimer) {
        resumeAfterSeek = !resumeAfterSeek;
        if (!resumeAfterSeek) pauseBoth();
        tick();
        return;
      }
      if (left.paused) playBoth();
      else pauseBoth();
    };
    document.getElementById("t0").onclick = () => mark("t0");
    document.getElementById("t1").onclick = () => mark("t1");
    document.getElementById("back15").onclick = () => skipBy(-15);
    document.getElementById("back").onclick = () => skipBy(-1);
    document.getElementById("fwd").onclick = () => skipBy(1);
    document.getElementById("fwd15").onclick = () => skipBy(15);

    scrub.addEventListener("pointerdown", () => {
      dragging = true;
      resumeAfterSeek = !left.paused;
      if (!left.paused) pauseBoth();
    });
    scrub.addEventListener("input", () => {
      const dur = mediaDuration();
      pendingTime = (Number(scrub.value) / 1000) * (Number.isFinite(dur) && dur > 0 ? dur : 0);
      tick();
    });
    function finishScrub() {
      if (!dragging) return;
      dragging = false;
      const dur = mediaDuration();
      const t = (Number(scrub.value) / 1000) * (Number.isFinite(dur) && dur > 0 ? dur : 0);
      commitSeek(t, resumeAfterSeek);
    }
    scrub.addEventListener("change", finishScrub);
    scrub.addEventListener("pointerup", finishScrub);

    window.addEventListener("message", (event) => {
      if (!event.data || event.data.type !== "streamlit:render") return;
      const args = event.data.args || {};
      const leftFile = args.left_file || args.file || "";
      const rightFile = args.right_file || "";
      applySource(leftFile, rightFile, args.port, args.sid);
      applySeek(args.seek_t, args.seek_n);
      setHeight();
    });
    function onParentSeek(event) {
      const d = event.data;
      if (!d || d.type !== "cutter-seek") return;
      applySeek(d.t, d.n);
    }
    try { window.parent.addEventListener("message", onParentSeek); } catch (e) {}
    try {
      if (window.parent.parent && window.parent.parent !== window.parent) {
        window.parent.parent.addEventListener("message", onParentSeek);
      }
    } catch (e) {}
    send("streamlit:componentReady", { apiVersion: 1 });
    setHeight();
  </script>
</body>
</html>
